name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      # Before install, so a split dependency tree is named as such rather than
      # surfacing later as a minified React error during a render.
      - run: node scripts/check-version-alignment.mjs
      # Catches a skill added under .claude/skills that never got mirrored to the other
      # five tool directories (.agents, .cursor, .github, .opencode, .windsurf).
      - run: node scripts/sync-skills.mjs --check
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openvidstudio/capture build
      - run: pnpm --filter @openvidstudio/capture typecheck
      - run: pnpm --filter @openvidstudio/mcp-server build
      - run: pnpm --filter @openvidstudio/mcp-server typecheck
  offline-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openvidstudio/mcp-server build
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx --yes playwright install --with-deps chromium
      # A2: every scene imports the core index, so a @remotion/google-fonts loader
      # anywhere in it (TerminalReplay/RepoCta/ChecklistPanel used to have one each)
      # reached fonts.gstatic.com at module scope and crashed any render with no
      # network. This scaffolds a project and renders through all three with real
      # network blocked, so that regressing back to a network font loader fails CI
      # instead of surfacing as a support issue from someone's offline machine.
      - run: node scripts/offline-render-check.mjs
